name: Secretos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Sin secretos en lo nuevo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      # Solo los commits nuevos: el historial viejo ya se revisó a mano y
      # escanearlo entero haría fallar cada push por hallazgos que no se pueden
      # reescribir sin force push.
      - name: Escanear
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          ANTES: ${{ github.event.before }}
          AHORA: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            RANGO="$BASE_PR..$AHORA"
          elif [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            RANGO="$ANTES..$AHORA"
          else
            RANGO="-1"
          fi
          ./gitleaks git --log-opts="$RANGO" --redact --no-banner --verbose

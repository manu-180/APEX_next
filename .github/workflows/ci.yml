name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  verify-secrets:
    name: Verify Secrets & Environment
    # Los runs que dispara Dependabot no reciben los secrets de Actions (solo los de
    # Dependabot, que no cargamos): el chequeo fallaría siempre. Usar github.actor y no
    # el autor del PR: si alguien pushea a la rama de Dependabot, el run sí trae secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check Sentry DSN
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" ]; then
            echo "❌ NEXT_PUBLIC_SENTRY_DSN is missing"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_SENTRY_DSN is configured"
          fi

      - name: Check PostHog Token
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}" ]; then
            echo "❌ NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN is missing"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN is configured"
          fi

      - name: Check PostHog Host
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" ]; then
            echo "❌ NEXT_PUBLIC_POSTHOG_HOST is missing"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_POSTHOG_HOST is configured"
          fi

      - name: Check GA ID
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" ]; then
            echo "❌ NEXT_PUBLIC_GA_MEASUREMENT_ID is missing"
            exit 1
          else
            echo "✅ NEXT_PUBLIC_GA_MEASUREMENT_ID is configured"
          fi

  build:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    needs: verify-secrets
    # Sin esto, el skip de verify-secrets en PRs de Dependabot saltearía también el build.
    if: ${{ !cancelled() && (needs.verify-secrets.result == 'success' || (needs.verify-secrets.result == 'skipped' && github.actor == 'dependabot[bot]')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present
